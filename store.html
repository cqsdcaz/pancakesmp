<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VectorGG Movie Hub - Watch Trailers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0c10;
            --surface: #1a1d24;
            --card: #22262f;
            --text: #ffffff;
            --text-secondary: #b3b9c5;
            --accent: #e50914;
            --accent-hover: #f81d2c;
            --gradient: linear-gradient(135deg, #e50914 0%, #b20710 100%);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            line-height: 1.5;
        }

        header {
            background: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(12px);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: var(--gradient);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: white;
            background: none;
        }

        .search-wrapper {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 500px;
        }

        input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 40px;
            border: 1px solid #333a44;
            background: #11151c;
            color: white;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.3);
        }

        button {
            padding: 12px 24px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
        }

        button:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
        }

        .tabs {
            display: flex;
            gap: 12px;
            padding: 20px 32px 0 32px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .tab-btn {
            background: transparent;
            border-radius: 40px;
            padding: 8px 24px;
            background: var(--surface);
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--gradient);
            color: white;
            box-shadow: 0 4px 12px rgba(229,9,20,0.3);
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 28px;
            padding: 32px;
        }

        .movie-card {
            background: var(--card);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .movie-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 30px -10px rgba(0,0,0,0.5);
            border-color: rgba(229,9,20,0.4);
        }

        .movie-card img {
            width: 100%;
            height: 310px;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .movie-card:hover img {
            transform: scale(1.03);
        }

        .info {
            padding: 14px;
        }

        .info h3 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffc107;
            font-size: 0.85rem;
        }

        .rating span {
            color: var(--text-secondary);
        }

        #movieModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--surface);
            border-radius: 28px;
            width: 90%;
            max-width: 950px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 30px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .close-btn {
            cursor: pointer;
            position: sticky;
            float: right;
            right: 20px;
            top: 16px;
            font-size: 32px;
            color: white;
            background: rgba(0,0,0,0.7);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 20;
            margin: 12px;
        }

        .close-btn:hover {
            background: var(--accent);
            transform: rotate(90deg);
        }

        .modal-detail-content {
            padding: 20px 28px 28px 28px;
            clear: both;
        }

        .modal-header {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .modal-poster {
            width: 180px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            object-fit: cover;
        }

        .modal-info {
            flex: 1;
        }

        .modal-info h2 {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .trailer-section {
            margin-top: 28px;
            background: #0f1117;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(229,9,20,0.3);
        }

        .trailer-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            font-weight: bold;
            color: var(--accent);
            font-size: 1.2rem;
        }

        .trailer-frame {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            position: relative;
        }

        .trailer-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .trailer-error {
            background: #2a1a1c;
            padding: 40px;
            text-align: center;
            border-radius: 16px;
            color: #ff9999;
        }

        .watch-trailer-btn {
            background: linear-gradient(135deg, #ff0000, #cc0000);
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-radius: 50px;
        }

        .movie-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin: 16px 0;
            color: var(--text-secondary);
        }

        .badge {
            background: rgba(229,9,20,0.2);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: var(--accent);
        }

        .loading-spinner {
            text-align: center;
            padding: 60px;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .alt-trailer-message {
            background: #1a1f2a;
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            text-align: center;
        }

        .youtube-link {
            color: var(--accent);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            background: rgba(229,9,20,0.15);
            padding: 10px 20px;
            border-radius: 40px;
            transition: 0.2s;
        }

        .youtube-link:hover {
            background: rgba(229,9,20,0.3);
        }

        @media (max-width: 640px) {
            .movie-grid { gap: 16px; padding: 20px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .movie-card img { height: 220px; }
            .modal-header { flex-direction: column; align-items: center; text-align: center; }
            .modal-poster { width: 140px; }
            .search-wrapper { max-width: 100%; }
            header { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Vector<span>GG</span> Movie Hub</div>
    <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="Search any movie... (e.g., Inception, Interstellar)">
        <button id="searchBtn">Search</button>
    </div>
</header>

<div class="tabs">
    <button class="tab-btn active" data-tab="trending">🔥 Trending Now</button>
    <button class="tab-btn" data-tab="popular">⭐ Popular Movies</button>
    <button class="tab-btn" data-tab="toprated">🏆 Top Rated</button>
</div>

<main id="movieContainer" class="movie-grid"></main>

<div id="movieModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modalDetails"></div>
    </div>
</div>

<script>
    const API_KEY = '339797286173982f402ff9a3d4b9333e';
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMAGE_URL = 'https://image.tmdb.org/t/p/w500';

    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const container = document.getElementById('movieContainer');
    const modal = document.getElementById('movieModal');
    const modalDetails = document.getElementById('modalDetails');

    let currentTab = 'trending';

    // Fetch movies by category (default movies on start)
    async function fetchMoviesByCategory(category, query = null) {
        container.innerHTML = `<div class="loading-spinner"><div>🎬 Loading amazing movies...</div></div>`;
        
        let url = '';
        if (query) {
            url = `${BASE_URL}/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`;
        } else {
            if (category === 'trending') {
                url = `${BASE_URL}/trending/movie/week?api_key=${API_KEY}`;
            } else if (category === 'popular') {
                url = `${BASE_URL}/movie/popular?api_key=${API_KEY}`;
            } else if (category === 'toprated') {
                url = `${BASE_URL}/movie/top_rated?api_key=${API_KEY}`;
            }
        }

        try {
            const res = await fetch(url);
            const data = await res.json();
            const movies = data.results || [];

            if (movies.length === 0) {
                container.innerHTML = `<div class="empty-state">✨ No movies found. Try a different search!</div>`;
                return;
            }

            container.innerHTML = '';
            let displayed = 0;
            movies.forEach(movie => {
                if (!movie.poster_path) return;
                displayed++;
                const div = document.createElement('div');
                div.className = 'movie-card';
                div.onclick = () => showMovieDetails(movie.id);
                div.innerHTML = `
                    <img src="${IMAGE_URL}${movie.poster_path}" alt="${movie.title}" loading="lazy">
                    <div class="info">
                        <h3>${escapeHtml(movie.title)}</h3>
                        <div class="rating">⭐ ${movie.vote_average?.toFixed(1) || '?'}<span>/10</span></div>
                    </div>
                `;
                container.appendChild(div);
            });
            if (displayed === 0) {
                container.innerHTML = `<div class="empty-state">😢 No posters available for these movies.</div>`;
            }
        } catch (e) {
            console.error(e);
            container.innerHTML = `<div class="empty-state">❌ Network error. Please check your connection.</div>`;
        }
    }

    // Helper to escape HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Search handler
    async function searchMovies() {
        const query = searchInput.value.trim();
        if (!query) {
            fetchMoviesByCategory(currentTab);
            return;
        }
        currentTab = null;
        container.innerHTML = '<div class="loading-spinner">🔍 Searching cinema database...</div>';
        try {
            const res = await fetch(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
            const data = await res.json();
            const movies = data.results || [];
            if (movies.length === 0) {
                container.innerHTML = `<div class="empty-state">😔 No results for "${escapeHtml(query)}". Try another title.</div>`;
                return;
            }
            container.innerHTML = '';
            movies.forEach(movie => {
                if (!movie.poster_path) return;
                const div = document.createElement('div');
                div.className = 'movie-card';
                div.onclick = () => showMovieDetails(movie.id);
                div.innerHTML = `
                    <img src="${IMAGE_URL}${movie.poster_path}" alt="${movie.title}" loading="lazy">
                    <div class="info">
                        <h3>${escapeHtml(movie.title)}</h3>
                        <div class="rating">⭐ ${movie.vote_average?.toFixed(1) || '?'}<span>/10</span></div>
                    </div>
                `;
                container.appendChild(div);
            });
        } catch (e) {
            container.innerHTML = '<div class="empty-state">⚠️ Failed to load search results.</div>';
        }
    }

    // FIXED: Better trailer fetching with multiple fallback methods
    async function getTrailerKey(movieId) {
        try {
            const res = await fetch(`${BASE_URL}/movie/${movieId}/videos?api_key=${API_KEY}`);
            const data = await res.json();
            
            // Prioritize official trailers from YouTube
            const videos = data.results || [];
            
            // Try to find official trailer
            let trailer = videos.find(v => v.type === 'Trailer' && v.site === 'YouTube' && (v.name?.toLowerCase().includes('official') || v.official === true));
            if (!trailer) {
                trailer = videos.find(v => v.type === 'Trailer' && v.site === 'YouTube');
            }
            if (!trailer) {
                trailer = videos.find(v => (v.type === 'Teaser' || v.type === 'Clip') && v.site === 'YouTube');
            }
            if (!trailer && videos.length > 0) {
                trailer = videos.find(v => v.site === 'YouTube');
            }
            
            return trailer ? trailer.key : null;
        } catch (err) {
            console.warn("Trailer fetch error:", err);
            return null;
        }
    }

    // Alternative: Open YouTube in a new tab if embed fails
    function createYouTubeEmbed(key, retryCount = 0) {
        // Multiple embed strategies to avoid configuration errors
        const origins = [
            `https://www.youtube-nocookie.com/embed/${key}?autoplay=0&rel=0&modestbranding=1&enablejsapi=1`,
            `https://www.youtube.com/embed/${key}?autoplay=0&rel=0&origin=${window.location.origin}`,
            `https://www.youtube.com/embed/${key}?autoplay=0`
        ];
        
        const iframe = document.createElement('iframe');
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen');
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.src = origins[retryCount % origins.length];
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        
        return iframe;
    }

    async function showMovieDetails(movieId) {
        modalDetails.innerHTML = `<div class="modal-detail-content" style="text-align:center; padding:40px;">🎬 Loading movie details & finding trailer...</div>`;
        modal.style.display = 'flex';
        
        try {
            const movieRes = await fetch(`${BASE_URL}/movie/${movieId}?api_key=${API_KEY}`);
            const movie = await movieRes.json();
            
            // Get trailer key
            const trailerKey = await getTrailerKey(movieId);
            
            const posterHtml = movie.poster_path ? 
                `<img class="modal-poster" src="${IMAGE_URL}${movie.poster_path}" alt="${escapeHtml(movie.title)}">` : 
                `<div style="width:180px; background:#2a2f3a; border-radius:16px; display:flex; align-items:center; justify-content:center; min-height:270px;">🎞️ No Poster</div>`;
            
            const genres = movie.genres ? movie.genres.map(g => g.name).join(', ') : 'N/A';
            const runtime = movie.runtime ? `${movie.runtime} min` : 'Unknown';
            const releaseDate = movie.release_date ? movie.release_date.split('-')[0] : 'TBA';
            
            let trailerHTML = '';
            
            if (trailerKey) {
                // Create a container with manual retry option
                const trailerContainerId = `trailer-${Date.now()}`;
                trailerHTML = `
                    <div class="trailer-section">
                        <div class="trailer-title">
                            🎥 <strong>Official Trailer</strong>
                        </div>
                        <div id="${trailerContainerId}" class="trailer-frame">
                            <div style="display:flex; align-items:center; justify-content:center; height:100%; background:#000;">
                                <div style="text-align:center;">
                                    <div class="loading-spinner" style="padding:20px;">Loading trailer...</div>
                                </div>
                            </div>
                        </div>
                        <div style="display:flex; gap:12px; justify-content:center; margin-top:16px; flex-wrap:wrap;">
                            <button class="watch-trailer-btn" onclick="window.open('https://www.youtube.com/watch?v=${trailerKey}', '_blank')">
                                ▶️ Watch on YouTube (New Tab)
                            </button>
                            <button class="watch-trailer-btn" onclick="retryTrailer('${trailerContainerId}', '${trailerKey}')" style="background:#444;">
                                🔄 Reload Trailer
                            </button>
                        </div>
                        <p style="font-size:0.8rem; color:#aaa; text-align:center; margin-top:12px;">
                            💡 If trailer doesn't load, click "Watch on YouTube" to view directly
                        </p>
                    </div>
                `;
                
                // Use setTimeout to ensure DOM is ready
                setTimeout(() => {
                    const containerEl = document.getElementById(trailerContainerId);
                    if (containerEl) {
                        try {
                            // Clear and add iframe
                            containerEl.innerHTML = '';
                            const iframe = createYouTubeEmbed(trailerKey, 0);
                            containerEl.appendChild(iframe);
                            
                            // Handle iframe load error
                            iframe.onerror = () => {
                                containerEl.innerHTML = `
                                    <div style="display:flex; align-items:center; justify-content:center; height:100%; background:#1a1a1a; flex-direction:column; gap:15px;">
                                        <span>⚠️ Trailer failed to load</span>
                                        <button onclick="window.open('https://www.youtube.com/watch?v=${trailerKey}', '_blank')" style="padding:8px 16px; background:#e50914; border:none; border-radius:8px; color:white; cursor:pointer;">
                                            Watch on YouTube →
                                        </button>
                                    </div>
                                `;
                            };
                        } catch(e) {
                            console.error("iframe creation error", e);
                            containerEl.innerHTML = `<div class="trailer-error">⚠️ Unable to load video player. <a href="https://www.youtube.com/watch?v=${trailerKey}" target="_blank" style="color:#e50914;">Click here to watch on YouTube</a></div>`;
                        }
                    }
                }, 50);
            } else {
                trailerHTML = `
                    <div class="trailer-section">
                        <div class="trailer-title">
                            🎬 Trailer Unavailable
                        </div>
                        <div class="alt-trailer-message">
                            😢 No official trailer found for "${escapeHtml(movie.title)}".<br><br>
                            You can still enjoy these movie details!
                            <div class="youtube-link" onclick="searchYouTubeTrailer('${escapeHtml(movie.title)}')">
                                🔍 Search "${escapeHtml(movie.title)}" trailer on YouTube
                            </div>
                        </div>
                    </div>
                `;
            }
            
            modalDetails.innerHTML = `
                <div class="modal-detail-content">
                    <div class="modal-header">
                        ${posterHtml}
                        <div class="modal-info">
                            <h2>${escapeHtml(movie.title)} <span class="badge">${releaseDate}</span></h2>
                            <div class="movie-meta">
                                <span>⭐ ${movie.vote_average?.toFixed(1) || '?'}/10 (${movie.vote_count?.toLocaleString() || 0} votes)</span>
                                <span>🎬 ${runtime}</span>
                                <span>🎭 ${escapeHtml(genres)}</span>
                            </div>
                            <p style="margin-top: 12px; line-height:1.6;">${escapeHtml(movie.overview) || "No overview available."}</p>
                        </div>
                    </div>
                    ${trailerHTML}
                    <div style="margin-top: 20px; text-align:center; font-size:0.75rem; color:#666; border-top:1px solid #2a2f3a; padding-top:16px;">
                        🍿 Data provided by TMDb
                    </div>
                </div>
            `;
        } catch (err) {
            console.error(err);
            modalDetails.innerHTML = `<div class="modal-detail-content" style="padding:30px;">❌ Failed to load movie details. Please try again.</div>`;
        }
    }

    // Global function for retry
    window.retryTrailer = function(containerId, trailerKey) {
        const container = document.getElementById(containerId);
        if (container) {
            container.innerHTML = '';
            const iframe = document.createElement('iframe');
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen');
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.src = `https://www.youtube.com/embed/${trailerKey}?autoplay=0&rel=0`;
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            container.appendChild(iframe);
        }
    };

    // Fallback search on YouTube
    window.searchYouTubeTrailer = function(movieTitle) {
        const searchQuery = encodeURIComponent(`${movieTitle} official trailer`);
        window.open(`https://www.youtube.com/results?search_query=${searchQuery}`, '_blank');
    };

    function closeModal() {
        modal.style.display = 'none';
        modalDetails.innerHTML = '';
    }

    function setActiveTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.getAttribute('data-tab') === tabId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    function loadTabContent(tab) {
        currentTab = tab;
        searchInput.value = '';
        if (tab === 'trending') {
            fetchMoviesByCategory('trending');
        } else if (tab === 'popular') {
            fetchMoviesByCategory('popular');
        } else if (tab === 'toprated') {
            fetchMoviesByCategory('toprated');
        }
    }

    // Tab event listeners
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const tabValue = btn.getAttribute('data-tab');
            setActiveTab(tabValue);
            loadTabContent(tabValue);
        });
    });

    searchBtn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        currentTab = null;
        searchMovies();
    };
    
    searchInput.onkeyup = (e) => { 
        if(e.key === 'Enter') {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            currentTab = null;
            searchMovies();
        }
    };

    // Initialize with trending movies
    window.onload = () => {
        loadTabContent('trending');
    };

    window.onclick = (e) => { 
        if(e.target == modal) closeModal();
    };
</script>
